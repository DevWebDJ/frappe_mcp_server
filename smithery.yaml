# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: { FRAPPE_URL: config.frappeUrl || 'http://localhost:8000', FRAPPE_API_KEY: config.frappeApiKey, FRAPPE_API_SECRET: config.frappeApiSecret } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - frappeApiKey
      - frappeApiSecret
    properties:
      frappeUrl:
        type: string
        default: http://localhost:8000
        description: URL of the Frappe instance
      frappeApiKey:
        type: string
        description: Frappe API key
      frappeApiSecret:
        type: string
        description: Frappe API secret
  exampleConfig:
    frappeUrl: https://demo.frappe.com
    frappeApiKey: 1234567890abcdef
    frappeApiSecret: abcdef1234567890
